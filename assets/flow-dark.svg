<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" fill="none" role="img" aria-labelledby="title description">
<title id="title">From interface to infrastructure</title>
<desc id="description">Experience: Flutter and React. Application: BLoC and Riverpod. Service: Laravel and REST. Data: SQL and Firebase. This diagram describes capabilities, not a single project's architecture.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#263548" stroke-opacity=".32" stroke-width=".6"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79E8C5"/><stop offset=".55" stop-color="#83B8FF"/><stop offset="1" stop-color="#FF927F"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111C2A"/><stop offset="1" stop-color="#0B111B"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#83B8FF" stop-opacity=".14"/><stop offset="1" stop-color="#83B8FF" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="1200" height="210" rx="22"/></clipPath>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 2px; }
.muted { fill: #A5B5C9; }
.faint { fill: #71839B; }
.packet { animation: packet 6s linear infinite; }
.packet-two { animation-delay: -3s; }
@keyframes packet { 0% { transform: translateX(0); opacity: 0; } 5%,90% { opacity: 1; } 100% { transform: translateX(1070px); opacity: 0; } }
.endpoint { animation: endpoint 4s ease-in-out infinite; }
@keyframes endpoint { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
  .role { animation: none !important; transform: none !important; opacity: 0 !important; }
  .role-1 { opacity: 1 !important; }
  .packet-motion { display: none; }
}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="210" fill="#0B111B"/>
<rect width="1200" height="210" fill="url(#grid)" opacity=".5"/>
<g transform="translate(36 35)">
<rect width="246" height="124" rx="12" fill="#111C2A" stroke="#263548"/>
<path d="M18 0H72" stroke="#83B8FF" stroke-width="2"/>
<text x="18" y="29" fill="#83B8FF" class="mono" font-size="9.5" letter-spacing="1.2">01 / EXPERIENCE</text>
<text x="18" y="64" fill="#F2F6FC" font-size="20" font-weight="650" letter-spacing="-.4">Flutter · React</text>
<text x="18" y="91" fill="#A5B5C9" font-size="12">Interfaces people enjoy</text>
</g><path d="M290 97H320M315 93L320 97L315 101" stroke="#71839B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(330 35)">
<rect width="246" height="124" rx="12" fill="#111C2A" stroke="#263548"/>
<path d="M18 0H72" stroke="#79E8C5" stroke-width="2"/>
<text x="18" y="29" fill="#79E8C5" class="mono" font-size="9.5" letter-spacing="1.2">02 / APPLICATION</text>
<text x="18" y="64" fill="#F2F6FC" font-size="20" font-weight="650" letter-spacing="-.4">BLoC · Riverpod</text>
<text x="18" y="91" fill="#A5B5C9" font-size="12">Predictable app state</text>
</g><path d="M584 97H614M609 93L614 97L609 101" stroke="#71839B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(624 35)">
<rect width="246" height="124" rx="12" fill="#111C2A" stroke="#263548"/>
<path d="M18 0H72" stroke="#FF927F" stroke-width="2"/>
<text x="18" y="29" fill="#FF927F" class="mono" font-size="9.5" letter-spacing="1.2">03 / SERVICE</text>
<text x="18" y="64" fill="#F2F6FC" font-size="20" font-weight="650" letter-spacing="-.4">Laravel · REST</text>
<text x="18" y="91" fill="#A5B5C9" font-size="12">Secure business logic</text>
</g><path d="M878 97H908M903 93L908 97L903 101" stroke="#71839B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(918 35)">
<rect width="246" height="124" rx="12" fill="#111C2A" stroke="#263548"/>
<path d="M18 0H72" stroke="#E9C98D" stroke-width="2"/>
<text x="18" y="29" fill="#E9C98D" class="mono" font-size="9.5" letter-spacing="1.2">04 / DATA</text>
<text x="18" y="64" fill="#F2F6FC" font-size="20" font-weight="650" letter-spacing="-.4">SQL · Firebase</text>
<text x="18" y="91" fill="#A5B5C9" font-size="12">Reliable persistence</text>
</g>
<g class="packet-motion"><circle class="motion packet" cx="65" cy="169" r="2.5" fill="#79E8C5"/><circle class="motion packet packet-two" cx="65" cy="169" r="2.5" fill="#83B8FF"/></g>
<path d="M65 169H1135" stroke="#263548" stroke-dasharray="2 6"/>
<text x="600" y="195" text-anchor="middle" fill="#A5B5C9" class="mono" font-size="9.5" letter-spacing="1.7">ONE PRODUCT. EVERY LAYER CONSIDERED.</text>
</g>
<rect x=".5" y=".5" width="1199" height="209" rx="21.5" stroke="#263548"/>
</svg>
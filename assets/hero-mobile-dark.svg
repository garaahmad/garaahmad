<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" fill="none" role="img" aria-labelledby="title description">
<title id="title">Ahmad Al-Garably — Flutter &amp; Full-Stack Developer</title>
<desc id="description">4+ years in Flutter. Full-stack web development with React and Laravel. Animated phone and browser illustrations.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#263548" stroke-opacity=".32" stroke-width=".6"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79E8C5"/><stop offset=".55" stop-color="#83B8FF"/><stop offset="1" stop-color="#FF927F"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111C2A"/><stop offset="1" stop-color="#0B111B"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#83B8FF" stop-opacity=".14"/><stop offset="1" stop-color="#83B8FF" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="640" height="680" rx="22"/></clipPath>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 2px; }
.muted { fill: #A5B5C9; }
.faint { fill: #71839B; }

.float-phone { animation: phone 7s ease-in-out infinite; }
.float-browser { animation: browser 8s ease-in-out infinite; }
.status-dot { animation: breathe 3s ease-in-out infinite; }
.role { opacity: 0; }
.role-1 { opacity: 1; animation: role-one 18s infinite; }
.role-2 { animation: role-two 18s infinite; }
.role-3 { animation: role-three 18s infinite; }
@keyframes phone { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes browser { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes role-one { 0%,28% { opacity:1; } 33%,95% { opacity:0; } 100% { opacity:1; } }
@keyframes role-two { 0%,28% { opacity:0; } 33%,61% { opacity:1; } 66%,100% { opacity:0; } }
@keyframes role-three { 0%,61% { opacity:0; } 66%,95% { opacity:1; } 100% { opacity:0; } }

@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
  .role { animation: none !important; transform: none !important; opacity: 0 !important; }
  .role-1 { opacity: 1 !important; }
  .packet-motion { display: none; }
}
</style>

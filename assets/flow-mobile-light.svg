<svg xmlns="http://www.w3.org/2000/svg" width="640" height="548" viewBox="0 0 640 548" fill="none" role="img" aria-labelledby="title description">
<title id="title">From interface to infrastructure</title>
<desc id="description">Experience: Flutter and React. Application: BLoC and Riverpod. Service: Laravel and REST. Data: SQL and Firebase. A capability map, not a single project's architecture.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#D5DFEB" stroke-opacity=".32" stroke-width=".6"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F69"/><stop offset=".55" stop-color="#245FBB"/><stop offset="1" stop-color="#BE4434"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FC"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#245FBB" stop-opacity=".14"/><stop offset="1" stop-color="#245FBB" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="640" height="548" rx="22"/></clipPath>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 2px; }
.muted { fill: #4D617B; }
.faint { fill: #64748B; }
.packet { animation: packet 6s linear infinite; }
@keyframes packet { 0% { transform: translateY(0); opacity: 0; } 10%,90% { opacity: 1; } 100% { transform: translateY(470px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
  .role { animation: none !important; transform: none !important; opacity: 0 !important; }
  .role-1 { opacity: 1 !important; }
  .packet-motion { display: none; }
}
</style>
<g clip-path="url(#frame)">
<rect width="640" height="548" fill="#F5F8FC"/>
<rect width="640" height="548" fill="url(#grid)" opacity=".5"/>

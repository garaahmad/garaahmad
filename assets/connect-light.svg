<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="154" viewBox="0 0 1200 154" fill="none" role="img" aria-labelledby="title description">
<title id="title">Let's build something that matters</title>
<desc id="description">Contact Ahmad about mobile and full-stack web development using the email and LinkedIn links below.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#D5DFEB" stroke-opacity=".32" stroke-width=".6"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F69"/><stop offset=".55" stop-color="#245FBB"/><stop offset="1" stop-color="#BE4434"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FC"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#245FBB" stop-opacity=".14"/><stop offset="1" stop-color="#245FBB" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="1200" height="154" rx="22"/></clipPath>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 2px; }
.muted { fill: #4D617B; }
.faint { fill: #64748B; }
.pulse { animation: pulse 3s ease-out infinite; transform-origin: 1090px 77px; }
@keyframes pulse { 0% { transform: scale(.9); opacity: .6; } 85%,100% { transform: scale(1.35); opacity: 0; } }
.arrow { animation: arrow 3s ease-in-out infinite; }
@keyframes arrow { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
  .role { animation: none !important; transform: none !important; opacity: 0 !important; }
  .role-1 { opacity: 1 !important; }
  .packet-motion { display: none; }
}
</style>
<g clip-path="url(#frame)">
<rect width="1200" height="154" fill="#F5F8FC"/>
<rect width="1200" height="154" fill="url(#grid)" opacity=".5"/>
<ellipse cx="1090" cy="77" rx="180" ry="140" fill="url(#halo)"/>
<path d="M56 0H300" stroke="url(#accent)" stroke-width="2"/>
<text x="56" y="39" fill="#087F69" class="label">HAVE AN IDEA? LET’S MAKE IT REAL.</text>
<text x="54" y="85" fill="#142338" font-size="32" font-weight="650" letter-spacing="-.8">Good products are built end to end.</text>
<text x="56" y="117" fill="#4D617B" font-size="14">Mobile, web, and the systems behind them. Let’s build something that matters.</text>
<circle class="motion pulse" cx="1090" cy="77" r="35" stroke="#087F69"/>
<circle cx="1090" cy="77" r="31" fill="#FFFFFF" stroke="#D5DFEB"/>
<g class="motion arrow"><path d="M1080 87L1100 67M1082 67H1100V85" stroke="#087F69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x=".5" y=".5" width="1199" height="153" rx="21.5" stroke="#D5DFEB"/>
</svg>
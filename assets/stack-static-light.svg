<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" fill="none" role="img" aria-labelledby="title description">
<title id="title">My engineering toolkit</title>
<desc id="description">Flutter, Dart, React, Laravel, PHP, TypeScript, Firebase, SQL, REST APIs, Clean Architecture and AI integrations. The moving labels are decorative; the same skills are listed in the README.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#D5DFEB" stroke-opacity=".32" stroke-width=".6"/></pattern>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087F69"/><stop offset=".55" stop-color="#245FBB"/><stop offset="1" stop-color="#BE4434"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FC"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#245FBB" stop-opacity=".14"/><stop offset="1" stop-color="#245FBB" stop-opacity="0"/></radialGradient>
  <clipPath id="frame"><rect width="1200" height="80" rx="22"/></clipPath>
<clipPath id="window"><rect width="1200" height="80"/></clipPath>
<linearGradient id="fade"><stop stop-color="white" stop-opacity="0"/><stop offset=".055" stop-color="white"/><stop offset=".945" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="edges"><rect width="1200" height="80" fill="url(#fade)"/></mask></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 2px; }
.muted { fill: #4D617B; }
.faint { fill: #64748B; }
.marquee { animation: marquee 42s linear infinite; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-1438px); } }
@media (prefers-reduced-motion: reduce) {
  .motion { animation: none !important; }
  .role { animation: none !important; transform: none !important; opacity: 0 !important; }
  .role-1 { opacity: 1 !important; }
  .packet-motion { display: none; }
}

.motion, .role { animation: none !important; }
.role { opacity: 0 !important; transform: none !important; }
.role-1 { opacity: 1 !important; }
.packet-motion { display: none !important; }
</style>
<g clip-path="url(#frame)">
